name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test

  test-e2e-realtime:
    name: test-e2e-realtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Realtime e2e tests
        run: npm run test:e2e

  test-e2e-sfu:
    name: test-e2e-sfu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sfu e2e tests
        run: npm run test:e2e:sfu

  changes:
    name: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            realtime:
              - 'apps/realtime/**'
              - 'libs/**'
              - 'package.json'
              - 'package-lock.json'
            sfu:
              - 'apps/sfu/**'
              - 'libs/**'
              - 'package.json'
              - 'package-lock.json'
      - name: Build image matrix
        id: set-matrix
        run: |
          matrix='[]'
          if [ "${{ steps.filter.outputs.realtime }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"realtime","dockerfile":"apps/realtime/Dockerfile"}]')
          fi
          if [ "${{ steps.filter.outputs.sfu }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"sfu","dockerfile":"apps/sfu/Dockerfile"}]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build-and-push
    needs: [lint, test, test-e2e-realtime, test-e2e-sfu, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meet-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
