apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfu-a
  namespace: meet
  labels:
    app: sfu
    instance: sfu-a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      instance: sfu-a
  template:
    metadata:
      labels:
        app: sfu
        instance: sfu-a
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: sfu
          image: meet-sfu:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: WEBRTC_ANNOUNCED_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: sfu-node-config
                  key: announcedAddress
            - name: WEBRTC_PORT_RANGE_MIN
              value: '40000'
            - name: WEBRTC_PORT_RANGE_MAX
              value: '44999'
          readinessProbe:
            httpGet:
              path: /media-rooms/stats
              port: 3000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /media-rooms/stats
              port: 3000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sfu-a
  namespace: meet
spec:
  selector:
    instance: sfu-a
  ports:
    - port: 3000
      targetPort: 3000
---
