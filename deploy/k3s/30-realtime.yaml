apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: meet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime
  template:
    metadata:
      labels:
        app: realtime
    spec:
      containers:
        - name: realtime
          image: meet-realtime:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: REDIS_URL
              value: redis://redis.meet.svc.cluster.local:6379
            - name: SFU_SERVICE_URLS
              value: http://sfu-a.meet.svc.cluster.local:3000,http://sfu-b.meet.svc.cluster.local:3001
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: meet
spec:
  selector:
    app: realtime
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realtime
  namespace: meet
spec:
  tls:
    - hosts:
        - meet.local
      secretName: meet-tls
  rules:
    - host: meet.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  number: 3000
